name: Generate ElevenLabs Audio

on:
  workflow_dispatch:
    inputs:
      story:
        description: Story to record
        required: true
        default: all
        type: choice
        options:
          - all
          - christmas-carol
          - tale-of-two-cities
          - cosi-fan-tutte
          - parent-trap-1961
          - little-fugitive-1953
          - la-fille-mal-gardee
      voice_id:
        description: ElevenLabs voice ID
        required: true
        default: JBFqnCBsd6RMkjVDRZzb

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate story data
        run: npm run validate

      - name: Generate audio
        run: node scripts/generate-audio.mjs --story "${{ inputs.story }}" --voice "${{ inputs.voice_id }}"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL_ID: eleven_v4
          ELEVENLABS_OUTPUT_FORMAT: mp3_44100_128

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Generate narration audio"
            git push
          fi
