name: Generate ElevenLabs Audio

on:
  workflow_dispatch:
    inputs:
      collection:
        description: Collection to record
        required: true
        default: stories
        type: choice
        options:
          - stories
          - natural-experiments
          - all
      story:
        description: Item to record
        required: true
        default: all
        type: choice
        options:
          - all
          - christmas-carol
          - tale-of-two-cities
          - cosi-fan-tutte
          - la-fille-mal-gardee
          - harlequinade
          - of-salt-and-shore
          - bateson-metalogues
          - mixed-up-files-frankweiler
          - korea-japan-christianity
      voice_id:
        description: ElevenLabs voice ID
        required: true
        default: JBFqnCBsd6RMkjVDRZzb
      audrey_voice_id:
        description: ElevenLabs Audrey voice ID for dialogue items
        required: false
        default: jkUnCsbErmJrcbWk1Hmh
      paxten_voice_id:
        description: ElevenLabs Paxten voice ID for dialogue items
        required: false
        default: XXphLKNRxvJ1Qa95KBhX

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Validate story data
        run: npm run validate

      - name: Generate audio
        run: node scripts/generate-audio.mjs --collection "${{ inputs.collection }}" --story "${{ inputs.story }}" --voice "${{ inputs.voice_id }}"
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_MODEL_ID: eleven_v4
          ELEVENLABS_DIALOGUE_MODEL_ID: eleven_v4
          ELEVENLABS_AUDREY_VOICE_ID: ${{ inputs.audrey_voice_id }}
          ELEVENLABS_PAXTEN_VOICE_ID: ${{ inputs.paxten_voice_id }}
          ELEVENLABS_OUTPUT_FORMAT: mp3_44100_128

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Generate narration audio"
            git push
          fi
