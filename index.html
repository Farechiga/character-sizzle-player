<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Spoken introductions to classic stories and kid-friendly natural experiments."
    >
    <title>Story and Natural Experiment Player</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="masthead" aria-labelledby="page-title">
        <h1 id="page-title">Stories and questions, introduced aloud.</h1>
        <p id="page-subtitle" class="lede">
          Choose a creative-work introduction or a natural-experiment mystery.
        </p>
      </section>

      <section class="player-panel" aria-label="Audio player">
        <div class="mode-switch" aria-label="Choose player mode">
          <button class="mode-button" type="button" data-mode="stories">Creative works</button>
          <button class="mode-button is-active" type="button" data-mode="natural-experiments">Natural experiments</button>
        </div>

        <div class="controls">
          <label id="item-label" class="select-label" for="story-select">Story</label>
          <select id="story-select" class="story-select"></select>
          <button id="play-button" class="play-button" type="button" aria-label="Play selected story">
            <span class="play-symbol" aria-hidden="true"></span>
          </button>
        </div>

        <audio id="audio-player" preload="none"></audio>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="story-view" aria-labelledby="story-title">
        <h2 id="story-title"></h2>
        <p id="story-focus" class="focus-line"></p>
        <div id="evidence-panel" class="evidence-panel" hidden>
          <p id="framing-line" class="framing-line"></p>
          <div id="comparison-list" class="comparison-list"></div>
        </div>
        <div id="script" class="script"></div>
        <section id="sources-panel" class="sources-panel" aria-labelledby="sources-title" hidden>
          <h3 id="sources-title">Sources</h3>
          <ul id="source-list"></ul>
        </section>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
